
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CargoConnect – Inscription</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                  url('https://images.unsplash.com/photo-1601584115193-04b2a1e8a8b8?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .form-box {
      position: relative; /* مهم للسهم */
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px 35px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* سهم الرجوع */
    .back-arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .back-arrow a {
      font-size: 32px;
      color: white;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.2);
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      backdrop-filter: blur(5px);
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .back-arrow a:hover {
      background: #ff8c00;
      transform: scale(1.1);
      border-color: #ff8c00;
    }

    h1 {
      color: white;
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }

    .slogan {
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
    }

    h2 {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 25px;
      border-left: 4px solid #ff8c00;
      padding-left: 15px;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      font-size: 16px;
      color: white;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus {
      border-color: #ff8c00;
      background: rgba(255, 255, 255, 0.25);
    }

    button {
      width: 100%;
      padding: 15px;
      background: #ff8c00;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin: 10px 0 20px;
    }
  


.back-arrow {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
}

.back-arrow a {
  font-size: 32px;
  color: white;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.2);
  width: 45px;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  backdrop-filter: blur(5px);
  transition: 0.2s;
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.back-arrow a:hover {
  background: #ff8c00;
  transform: scale(1.1);
  border-color: #ff8c00;
}

    button:hover {
      background: #ffa347;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
    }

    .login-link {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
    }

    .login-link a {
      color: #faf7ff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <!-- سهم الرجوع هنا -->
      <div class="back-arrow">
        <a href="javascript:history.back()">←</a>
      </div>

      <h1>CargoConnect</h1>
      <p class="slogan">Transport sûr et rapide</p>

      <h2>Creer un compte</h2>

      <form>
        <input type="text" placeholder="Prenom" required>
        <input type="text" placeholder="Nom" required>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Numéro" value="+213 xxx xxxx xxx" required>
        <input type="password" placeholder="Mot de passe" required>
        <input type="password" placeholder="Confirmer" required>

        <button type="submit">Inscription</button>
      </form>

<p class="login-link">
        Vous avez déjà un compte ? <a href="#">Connexion</a>
      </p>
    </div>
  </div>
  <!-- نوع الحساب -->
<div class="form-group">
  <label for="accountType">Vous êtes :</label>
  <select id="accountType" name="accountType" required>
    
    <option value="client">Client</option>
    <option value="chauffeur">Chauffeur</option>
     <option value="Admin">Admin</option>
    
  </select>
    
  </select>
</div>
</body>
</html>
